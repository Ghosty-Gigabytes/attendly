spring.application.name=attendly-server
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/attendly}
spring.datasource.username=${DATABASE_USER:attendly}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.flyway.enabled=true
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${COOKIE_SECURE:true}
server.servlet.session.timeout=7d
server.error.include-message=never
server.error.include-stacktrace=never
attendly.web-origin=${WEB_ORIGIN:http://localhost:5173}
spring.servlet.multipart.max-request-size=1MB
server.tomcat.max-http-form-post-size=1MB
