services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: attendly
      POSTGRES_USER: attendly
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD before starting Postgres}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - attendly-db:/var/lib/postgresql/data
volumes:
  attendly-db:
