name: attendly
description: Independent attendance records and thoughtful leave planning for NSUT.
publish_to: none
version: 0.2.0+4
environment:
  sdk: '>=3.8.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.0.0
  dio: ^5.9.0
  cookie_jar: ^4.0.8
  dio_cookie_manager: ^3.3.0
  html: ^0.15.6
  drift: ^2.30.0
  sqlite3: ^3.0.0
  path_provider: ^2.1.5
  path: ^1.9.1
  intl: ^0.20.2
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/roboto-regular.ttf
        - asset: assets/fonts/roboto-bold.ttf
          weight: 700
  assets:
    - assets/tessdata/
    - assets/fonts/roboto_license.txt
