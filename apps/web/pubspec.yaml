name: attendly_web
description: Attendly on desktop and iPhone, with offline records and account sync.
publish_to: none
version: 0.1.0+1
environment:
  sdk: '>=3.8.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  attendly_core:
    path: ../../packages/attendly_core
  dio: ^5.9.0
  web: ^1.1.1
  intl: ^0.20.2
  sembast: ^3.8.5
  sembast_web: ^2.4.0
  uuid: ^4.5.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
    - assets/fonts/roboto_license.txt
  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/roboto-regular.ttf
        - asset: assets/fonts/roboto-bold.ttf
          weight: 700
